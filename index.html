<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="حلالي">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>حلالي</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d1b16;--mut:#7a7366;--line:#e0d9ca;--acc:#7a5c2e;--onacc:#fff;
--m:#dbe7f7;--mi:#1f4f8f;--f:#dcefdc;--fi:#256a2f;--y1:#fbe9c8;--y1i:#8a5a00;--y0:#f8dfe6;--y0i:#9a3156;--red:#b3261e;--side:#2f2a22;--sidei:#efe7d6}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1f1c18;--ink:#f2ede3;--mut:#a39b8c;--line:#3a352d;--acc:#d8b27a;--onacc:#1d1b16;
--m:#1d2c42;--mi:#9cc2f5;--f:#1c3320;--fi:#95d39d;--y1:#3a2e14;--y1i:#f0c66b;--y0:#3a1f29;--y0i:#f2a3bd;--red:#f2867e;--side:#0c0b09}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text;font:inherit;font-size:17px}
button{font:inherit;cursor:pointer}
#app{display:flex;height:100%}
#side{width:78px;flex:none;background:var(--side);color:var(--sidei);display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 6px calc(env(safe-area-inset-bottom) + 12px)}
#side button{background:none;border:0;color:inherit;border-radius:16px;padding:12px 2px;font-size:28px;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1}
#side button span{font-size:16px;font-weight:800}
#side button.on{background:var(--acc);color:var(--onacc)}
#side .sp{flex:1}
#side button.tool{font-size:20px;padding:8px 2px;opacity:.85}
#side button.tool span{font-size:12px;font-weight:600}
#side .ver{margin-top:4px;text-align:center;font-size:11px;background:rgba(255,255,255,.12);border-radius:12px;padding:6px 2px;line-height:1.3}
#side .ver b{display:block;font-size:20px;color:#ffd21f}
#main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 40px)}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mh h1{margin:0;font-size:28px;flex:1}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:12px;font-weight:700;font-size:15px}
.btn.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.sum{font-size:13px;color:var(--mut);margin:2px 0 12px;line-height:1.7}
.hint{background:var(--acc);color:var(--onacc);padding:10px 12px;border-radius:12px;font-size:14px;margin-bottom:12px}
.pen{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:14px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ph b{font-size:18px;flex:1}
.cnt{font-size:13px;color:var(--mut);background:var(--bg);padding:2px 8px;border-radius:20px}
.mini{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;min-width:0;transition:transform .12s}
.cell b{font-size:19px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.cell small{font-size:9px;opacity:.85;white-space:nowrap;max-width:100%;overflow:hidden}
.cell.n{background:#1f4fa8;color:#ffd21f;border:0}
.cell.fahl{background:#fff;color:#000;border:1.5px solid #bdb5a3}
.cell.fahl small{font-size:11px;font-weight:700;opacity:1;margin-bottom:1px}
.cell.tw{background:#0f5132;color:#ffd21f;border:0}
.cell.tr{background:#b5121b;color:#8ecbff;border:0}
.lg-n{background:#1f4fa8}.lg-fahl{background:#fff;border:1px solid #bdb5a3}.lg-tw{background:#0f5132}.lg-tr{background:#b5121b}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:2px 7px;margin-inline-start:6px}
.badge.tw{background:#0f5132;color:#ffd21f}.badge.tr{background:#b5121b;color:#8ecbff}
.dayh{font-size:14px;font-weight:800;color:var(--acc);margin:16px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.bgrp{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-top:10px;background:var(--bg)}
.bgrp .item{border-top:1px solid var(--line)}
.bgh{display:flex;align-items:center;gap:6px;padding:8px 0}
.bgh>div{flex:1;min-width:0}.bgh b{font-size:17px}
.lg-ico{font-size:20px;width:28px;text-align:center;flex:none}
.lg-time{font-size:12px;color:var(--mut);flex:none}
.cell.sel{outline:3px solid var(--acc);transform:scale(.9)}
.cell.drop{border-color:var(--acc)}
.addrow{display:block;margin:8px auto 0;background:none;border:0;color:var(--mut);font-size:14px;padding:4px 10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-left:4px}
/* animal page */
#page{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:10;display:none;padding:0 0 calc(env(safe-area-inset-bottom) + 40px)}
#page.on{display:block}
.pg-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.pg-head b{flex:1;text-align:center;font-size:18px}
.back{background:none;border:0;color:var(--acc);font-size:17px;font-weight:700;padding:6px}
.pg{padding:12px}
.photo{width:100%;aspect-ratio:4/3;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);font-size:17px}
.photo img{width:100%;height:100%;object-fit:cover}
.info{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:17px;gap:10px}
.row:last-child{border-bottom:0}
.row span{color:var(--mut);font-size:15px;flex:none}
.row div{text-align:left;font-weight:700}
.big{font-size:26px;direction:ltr}
a.lk{color:var(--acc);text-decoration:underline;font-weight:800}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;padding:12px 14px}
.sec h3{margin:0 0 6px;font-size:18px;display:flex;align-items:center;justify-content:space-between}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item .t div{font-size:13px;color:var(--mut);margin-top:2px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:800;color:var(--acc);direction:ltr}
.del{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 6px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.exits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.exits button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px 4px;font-size:17px;font-weight:800}
.gone{background:var(--red);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:16px;line-height:1.6}
.gone button{margin-top:8px;background:#fff;color:#b3261e;border:0;border-radius:10px;padding:8px 14px;font-weight:800}
.muted{color:var(--mut)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;justify-content:flex-end}
#sheet.on{display:flex}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sh-box{position:relative;background:var(--bg);border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sh-head b{font-size:19px}
.x{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:15px}
.f label{display:block;font-size:14px;color:var(--mut);margin:12px 0 5px}
.f input,.f select,.f textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:48px;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:16px 21px,22px 21px;background-size:6px 6px;background-repeat:no-repeat}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pri{display:block;width:100%;background:var(--acc);color:var(--onacc);border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:800;margin-top:18px}
.sec2{display:block;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:16px;font-weight:700;margin-top:10px}
.danger{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:9px 14px;font-size:15px;font-weight:700}
.chips button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:15px;z-index:30;display:none;max-width:85%;text-align:center}
</style>
</head>
<body>
<div id="app">
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<div id="page"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="impIn" accept=".json,application/json" hidden>

<script>
const APP_VER='8';
const TYPES=[{k:'harri',n:'حري',e:'🐑'},{k:'naimi',n:'نعيمي',e:'🐏'},{k:'maaz',n:'معزا',e:'🐐'}];
// [الاسم, الجنس m/f, المرحلة: 2 كبير، 1 صغير، 0 رضيع]
const CATS={
 harri:[['فحل حري','m',2],['شاة','f',2],['طلي','m',1],['رخل','f',1],['رضيع','m',0],['رضيعة','f',0]],
 naimi:[['فحل نعيم','m',2],['نعيمية','f',2],['طلي نعيمي','m',1],['رخل نعيمي','f',1],['رضيع نعيمي','m',0],['رضيعة نعيمي','f',0]],
 maaz:[['فحل معزا','m',2],['معزا','f',2],['جفر','m',1],['جفرة','f',1],['رضيع جفر','m',0],['رضيع جفرة','f',0]]
};
const REASONS={dead:'موت',sold:'بيع',slaughter:'ذبح'};

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmt=d=>d?d.split('-').reverse().join('/'):'—';
const normNum=s=>String(s||'').trim().replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
const typeName=k=>(TYPES.find(t=>t.k===k)||{}).n||'';
function age(d){
  if(!d)return '';const b=new Date(d),n=new Date();if(isNaN(b))return '';
  let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;
  if(m<0)return '';if(m<1)return Math.max(0,Math.floor((n-b)/864e5))+' يوم';
  if(m<24)return m+' شهر';const y=Math.floor(m/12),r=m%12;return y+' سنة'+(r?' و'+r+' شهر':'');
}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}

/* ---------- التخزين ---------- */
let idb;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('halali',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('photos')};
  r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const idbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const idbPut=(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k));
const idbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const idbClear=s=>tx(s,'readwrite',o=>o.clear());
function idbAllPhotos(){return new Promise((res,rej)=>{const out={};const t=idb.transaction('photos');const c=t.objectStore('photos').openCursor();
  c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}

let D={v:1,animals:{},pens:[]};
let cur='harri',moveMode=false,sel=null,stack=[];
function save(){idbPut('kv','db',D).catch(()=>toast('تعذّر الحفظ!'))}

/* ---------- أدوات ---------- */
const catInfo=a=>(CATS[a.type].find(c=>c[0]===a.cat))||[a.cat,'f',2];
// الفحول لها أرقام مستقلة (m) عن بقية الحلال (o) داخل كل قسم
const spaceOf=(type,cat)=>{const c=CATS[type].find(x=>x[0]===cat)||[cat,'f',2];return c[1]==='m'&&c[2]===2?'m':'o'};
const isFahl=a=>spaceOf(a.type,a.cat)==='m';
const dn=a=>a?(isFahl(a)?'فحل '+a.num:a.num):'';
let MULTI={};
function calcMulti(){MULTI={};Object.values(D.animals).forEach(mo=>{const g={};mo.births.forEach(b=>{if(b.date)(g[b.date]=g[b.date]||[]).push(b)});
  Object.values(g).forEach(arr=>{if(arr.length>1)arr.forEach(b=>{if(b.childId)MULTI[b.childId]=arr.length})})})}
function cellCls(a){if(isFahl(a))return 'fahl';const n=MULTI[a.id]||0;return n>=3?'tr':n===2?'tw':'n'}
const multiBadge=n=>n>=3?'<span class="badge tr">ثلاثة</span>':n===2?'<span class="badge tw">توأم</span>':'';
const actives=type=>Object.values(D.animals).filter(a=>a.status==='a'&&(!type||a.type===type));
const findActive=(type,num,sp)=>actives(type).find(a=>a.num===num&&(!sp||spaceOf(a.type,a.cat)===sp));
function logE(k,a,x,type){D.log=D.log||[];D.log.push({t:Date.now(),k,type:a?a.type:(type||cur),id:a?a.id:'',x});if(D.log.length>6000)D.log.splice(0,D.log.length-6000)}
function penOf(id){return D.pens.find(p=>p.cells.includes(id))}
function removeFromPens(id){D.pens.forEach(p=>{const i=p.cells.indexOf(id);if(i>-1)p.cells[i]=null})}
function place(id,penId,idx){
  removeFromPens(id);const p=D.pens.find(x=>x.id===penId);if(!p)return;
  if(idx!=null&&p.cells[idx]==null){p.cells[idx]=id;return}
  let i=p.cells.indexOf(null);if(i<0){i=p.cells.length;p.cells.push(null,null,null,null,null)}p.cells[i]=id;
}
function parentOf(a,which){
  const id=a[which+'Id'],num=a[which];
  if(id&&D.animals[id])return D.animals[id];
  if(!num)return null;
  return findActive(a.type,num,which==='father'?'m':'o')||findActive(a.type,num)||Object.values(D.animals).find(x=>x.type===a.type&&x.num===num)||null;
}
function createAnimal(o){
  const a={id:uid(),type:o.type,num:o.num,cat:o.cat,birth:o.birth||'',father:o.father||'',mother:o.mother||'',
    fatherId:o.fatherId||'',motherId:o.motherId||'',births:[],ills:[],status:'a',end:null,photo:0,created:Date.now()};
  D.animals[a.id]=a;return a;
}
function penOptions(type,selId){return D.pens.filter(p=>p.type===type).map(p=>`<option value="${p.id}" ${p.id===selId?'selected':''}>${esc(p.name)}</option>`).join('')}
function catOptions(type,selName,filter){return CATS[type].filter(filter||(()=>true)).map(c=>`<option ${c[0]===selName?'selected':''}>${esc(c[0])}</option>`).join('')}
function malesList(type){return `<datalist id="dlm">${actives(type).filter(a=>{const c=catInfo(a);return c[1]==='m'&&c[2]===2}).map(a=>`<option value="${esc(a.num)}">`).join('')}</datalist>`}
function femalesList(type){return `<datalist id="dlf">${actives(type).filter(a=>{const c=catInfo(a);return c[1]==='f'&&c[2]===2}).map(a=>`<option value="${esc(a.num)}">`).join('')}</datalist>`}

/* ---------- الشاشة الرئيسية ---------- */
function renderSide(){
  $('#side').innerHTML=TYPES.map(t=>`<button class="${t.k===cur?'on':''}" onclick="setType('${t.k}')">${t.e}<span>${t.n}</span></button>`).join('')+
  `<div class="sp"></div>
   <button class="tool" onclick="openLog()">📋<span>التغييرات</span></button>
   <button class="tool" onclick="openSearch()">🔍<span>بحث</span></button>
   <button class="tool" onclick="openArchive()">🗂️<span>الأرشيف</span></button>
   <button class="tool" onclick="openBackup()">💾<span>نسخ احتياطي</span></button>
   <div class="ver">الإصدار<b>${APP_VER}</b></div>`;
}
function setType(k){cur=k;sel=null;try{localStorage.setItem('cur',k)}catch(e){}render();$('#main').scrollTop=0}
function render(){
  renderSide();calcMulti();
  const pens=D.pens.filter(p=>p.type===cur);
  const act=actives(cur);
  const counts=CATS[cur].map(c=>[c[0],act.filter(a=>a.cat===c[0]).length]).filter(x=>x[1]);
  const unplaced=act.filter(a=>!penOf(a.id));
  let h=`<div class="mh"><h1>${typeName(cur)}</h1>
    <button class="btn ${moveMode?'on':''}" onclick="toggleMove()">⇄ نقل</button>
    <button class="btn" onclick="addPen()">+ شبك</button></div>
    <div class="sum">المجموع: <b>${act.length}</b>${counts.length?' — '+counts.map(x=>esc(x[0])+' '+x[1]).join('، '):''}</div>`;
  if(moveMode)h+=`<div class="hint">${sel?'الآن اضغط المربع الذي تريد نقل الرقم إليه (أو رقماً آخر للتبديل)':'اضغط على الرقم الذي تريد نقله'}</div>`;
  if(unplaced.length)h+=`<div class="hint" style="background:var(--red);color:#fff">أرقام بدون شبك: ${unplaced.map(a=>`<a style="color:#fff;font-weight:800;text-decoration:underline" onclick="openAnimal('${a.id}')">${esc(dn(a))}</a>`).join('، ')}</div>`;
  h+=pens.map(penHTML).join('');
  if(!pens.length)h+=`<div class="empty">لا توجد شبوك. اضغط «+ شبك» لإضافة شبك.</div>`;
  h+=`<div class="legend"><span><i class="lg-n"></i>عادي</span><span><i class="lg-fahl"></i>فحل</span><span><i class="lg-tw"></i>توأم</span><span><i class="lg-tr"></i>ثلاثة</span></div>`;
  $('#main').innerHTML=h;
}
function penHTML(p){
  const n=p.cells.filter(Boolean).length;
  const cells=p.cells.map((id,i)=>{const a=id&&D.animals[id];
    const s=sel&&sel.p===p.id&&sel.i===i?' sel':'';
    if(!a)return `<div class="cell${moveMode&&sel?' drop':''}" data-p="${p.id}" data-i="${i}"></div>`;
    if(isFahl(a))return `<div class="cell fahl${s}" data-p="${p.id}" data-i="${i}"><small>فحل</small><b>${esc(a.num)}</b></div>`;
    return `<div class="cell ${cellCls(a)}${s}" data-p="${p.id}" data-i="${i}"><b>${esc(a.num)}</b><small>${esc(a.cat)}</small></div>`}).join('');
  return `<section class="pen"><div class="ph"><b onclick="penMenu('${p.id}')">${esc(p.name)}</b><span class="cnt">${n}</span><button class="mini" onclick="penMenu('${p.id}')">⋯</button></div>
    <div class="grid">${cells}</div><button class="addrow" onclick="addRow('${p.id}')">+ صف</button></section>`;
}
$('#main').addEventListener('click',e=>{
  const c=e.target.closest('.cell');if(!c)return;
  const p=D.pens.find(x=>x.id===c.dataset.p),i=+c.dataset.i,id=p.cells[i];
  if(moveMode){
    if(!sel){if(id){sel={p:p.id,i};render()}return}
    if(sel.p===p.id&&sel.i===i){sel=null;render();return}
    const sp=D.pens.find(x=>x.id===sel.p);const t=sp.cells[sel.i];sp.cells[sel.i]=p.cells[i];p.cells[i]=t;
    if(sp!==p){logE('move',D.animals[t],`نقل ${dn(D.animals[t])} من «${sp.name}» إلى «${p.name}»`);
      if(sp.cells[sel.i])logE('move',D.animals[sp.cells[sel.i]],`نقل ${dn(D.animals[sp.cells[sel.i]])} من «${p.name}» إلى «${sp.name}»`)}
    sel=null;save();render();toast('تم النقل');return;
  }
  if(id)openAnimal(id);else newAnimal(p.id,i);
});
function toggleMove(){moveMode=!moveMode;sel=null;render()}
function addRow(pid){const p=D.pens.find(x=>x.id===pid);p.cells.push(null,null,null,null,null);save();render()}
function addPen(){
  sheet('شبك جديد',`<div class="f"><label>اسم الشبك</label><input id="f_name" placeholder="مثلاً: شبك الأمهات">
    <label>عدد الصفوف (كل صف ٥ مربعات)</label><input id="f_rows" type="number" inputmode="numeric" value="2"></div>
    <button class="pri" onclick="savePen()">إضافة</button>`,()=>$('#f_name').focus());
}
function savePen(){

}
function penMenu(pid){
  const p=D.pens.find(x=>x.id===pid);const n=p.cells.filter(Boolean).length;
  sheet(esc(p.name),`<div class="f"><label>اسم الشبك</label><input id="f_name" value="${esc(p.name)}"></div>

   <button class="sec2 danger" onclick="delPen('${pid}')">حذف الشبك${n?' (يجب نقل الأرقام أولاً)':''}</button>`);
}
function renamePen(pid){const p=D.pens.find(x=>x.id===pid);const nn=$('#f_name').value.trim()||p.name;if(nn!==p.name)logE('pen',null,`تغيير اسم الشبك «${p.name}» إلى «${nn}»`,p.type);p.name=nn;save();closeSheet();render()}
function trimRow(pid){const p=D.pens.find(x=>x.id===pid);if(p.cells.length<=5)return toast('لا يمكن حذف الصف الوحيد');
  const last=p.cells.slice(-5);if(last.some(Boolean))return toast('آخر صف فيه أرقام');p.cells.splice(-5);save();closeSheet();render()}
function compactPen(pid){const p=D.pens.find(x=>x.id===pid);const ids=p.cells.filter(Boolean);
  const order=CATS[p.type].map(c=>c[0]);
  ids.sort((a,b)=>{const A=D.animals[a],B=D.animals[b];return order.indexOf(A.cat)-order.indexOf(B.cat)||A.num.localeCompare(B.num,undefined,{numeric:true})});
  const len=Math.max(5,Math.ceil(ids.length/5)*5,p.cells.length);p.cells=[...ids,...Array(len-ids.length).fill(null)];save();closeSheet();render()}
function movePen(pid,dir){const same=D.pens.filter(p=>p.type===cur);const i=same.findIndex(p=>p.id===pid),j=i+dir;if(j<0||j>=same.length)return;
  const gi=D.pens.indexOf(same[i]),gj=D.pens.indexOf(same[j]);[D.pens[gi],D.pens[gj]]=[D.pens[gj],D.pens[gi]];save();closeSheet();render()}
function delPen(pid){const p=D.pens.find(x=>x.id===pid);if(p.cells.some(Boolean))return toast('انقل الأرقام من الشبك أولاً');

/* ---------- صفحة الحيوان ---------- */
function openAnimal(id){closeSheet();if(stack.at(-1)!==id)stack.push(id);renderPage(true)}
function backPage(){stack.pop();renderPage(true)}
function renderPage(top){
  const el=$('#page');calcMulti();
  if(!stack.length){el.classList.remove('on');el.innerHTML='';render();return}
  const a=D.animals[stack.at(-1)];if(!a){stack.pop();return renderPage(top)}

  if(a.photo)idbGet('photos',a.id).then(src=>{if(src&&stack.at(-1)===a.id){const im=$('#pimg');im.src=src;im.hidden=false;$('#pph').hidden=true}});
}
const curA=()=>D.animals[stack.at(-1)];
function link(x){return x?`<a class="lk" onclick="openAnimal('${x.id}')">${esc(dn(x))}</a>${x.status!=='a'?' <span class="muted">('+REASONS[x.status]+')</span>':''}`:''}
function pageHTML(a){
  const c=catInfo(a),pen=penOf(a.id),fa=parentOf(a,'father'),mo=parentOf(a,'mother');
  let h=`<div class="pg-head"><button class="back" onclick="backPage()">→ رجوع</button><b>${typeName(a.type)} · ${esc(dn(a))}</b><button class="mini" onclick="editAnimal()">تعديل</button></div><div class="pg">`;
  if(a.status!=='a')h+=`<div class="gone">خرج الرقم: <b>${REASONS[a.status]}</b> بتاريخ ${fmt(a.end&&a.end.date)}${a.end&&a.end.note?'<br>'+esc(a.end.note):''}<br><button onclick="restoreAnimal()">إرجاعه للحلال</button></div>`;
  h+=`<div class="photo" onclick="pickPhoto()"><img id="pimg" hidden alt=""><span id="pph">📷 اضغط لإضافة صورة</span></div>
  <div class="info">
    <div class="row"><span>الرقم</span><div class="big">${esc(dn(a))}</div></div>
    <div class="row"><span>الفئة</span><div>${esc(a.cat)}${multiBadge(MULTI[a.id]||0)}</div></div>
    ${a.status==='a'?`<div class="row" onclick="moveSheet()"><span>الشبك</span><div>${pen?esc(pen.name):'<span class="danger">بدون شبك</span>'} <a class="lk" style="font-size:14px">نقل</a></div></div>`:''}
    <div class="row"><span>الميلاد</span><div>${fmt(a.birth)}${a.birth?' <span class="muted" style="font-weight:400">('+age(a.birth)+')</span>':''}</div></div>
    <div class="row"><span>الأب</span><div>${fa?link(fa):esc(a.father)||'—'}</div></div>
    <div class="row"><span>الأم</span><div>${mo?link(mo):esc(a.mother)||'—'}</div></div>
  </div>`;
  // ١ الولادات
  if(c[1]==='f'){
    const gs=birthGroups(a);
    h+=`<div class="sec"><h3>١ · الولادات <span class="muted" style="font-size:14px;flex:1;margin-right:8px">${gs.length?'('+gs.length+' ولادة · '+a.births.length+' مولود)':''}</span><button class="mini" onclick="addBirth()">+ ولادة</button></h3>`+
    (gs.length?gs.map((g,i)=>({g,i})).reverse().map(({g,i})=>{const prev=gs[i-1];const gap=prev&&prev.date&&g.date?monthsBetween(prev.date,g.date):'';
      return `<div class="bgrp"><div class="bgh"><div><b>الولادة ${ordinal(i+1)}</b>${multiBadge(g.items.length)}<div class="muted" style="font-size:13px">${g.date?fmt(g.date):'بدون تاريخ'}${gap?' · بعد '+gap+' من السابقة':''}${g.items[0].father?' · الأب فحل '+esc(g.items[0].father):''}</div></div>
        <button class="mini" onclick="editGroup('${g.key}')">تعديل</button><button class="mini" onclick="addBirth('${g.date}')">+ مولود</button></div>`+
      g.items.map(b=>{const ch=b.childId&&D.animals[b.childId];
      return `<div class="item"><div class="t" onclick="editBirth('${b.id}')"><b>${esc(b.cat)}</b></div>
      ${ch?`<a class="tag" onclick="openAnimal('${ch.id}')">${esc(ch.num)}</a>${ch.status!=='a'?'<span class="muted" style="font-size:13px">'+REASONS[ch.status]+'</span>':''}`:`<button class="mini" onclick="numberBirth('${b.id}')">ترقيم</button>`}
      <button class="del" onclick="delBirth('${b.id}')">✕</button></div>`}).join('')+`</div>`}).join(''):'<div class="empty">لا توجد ولادات مسجلة</div>')+`</div>`;
  }else{
    const kids=Object.values(D.animals).filter(x=>x.type===a.type&&x.id!==a.id&&(x.fatherId===a.id||(!x.fatherId&&x.father&&x.father===a.num)));
    h+=`<div class="sec"><h3>١ · مواليده ${kids.length?'('+kids.length+')':''}</h3>`+(kids.length?kids.sort((x,y)=>(y.birth||'').localeCompare(x.birth||'')).map(k=>
      `<div class="item"><div class="t"><b>${esc(k.cat)}</b>${multiBadge(MULTI[k.id]||0)}<div>${fmt(k.birth)}${k.mother?' · الأم '+esc(k.mother):''}</div></div><a class="tag" onclick="openAnimal('${k.id}')">${esc(k.num)}</a></div>`).join(''):'<div class="empty">لا يوجد مواليد مرقمة باسمه</div>')+`</div>`;
  }
  // ٢ الأمراض
  const il=[...a.ills].sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  h+=`<div class="sec"><h3>٢ · الأمراض <button class="mini" onclick="addIll()">+ مرض</button></h3>`+
   (il.length?il.map(x=>`<div class="item"><div class="t"><b>${esc(x.name)}</b><div>${fmt(x.date)}${x.note?' · '+esc(x.note):''}</div></div><button class="del" onclick="delIll('${x.id}')">✕</button></div>`).join(''):'<div class="empty">لا توجد أمراض مسجلة</div>')+`</div>`;
  // ٣ اختفاء الرقم
  h+=`<div class="sec"><h3>٣ · اختفاء الرقم</h3>`+(a.status==='a'?
    `<div class="muted" style="font-size:14px">عند الاختيار يخرج من الشبك ويصبح الرقم حراً، ويبقى سجله في الأرشيف.</div>
     <div class="exits"><button onclick="exitSheet('dead')">موت</button><button onclick="exitSheet('sold')">بيع</button><button onclick="exitSheet('slaughter')">ذبح</button></div>`
    :`<div class="item"><div class="t"><b>${REASONS[a.status]}</b><div>${fmt(a.end&&a.end.date)}${a.end&&a.end.note?' · '+esc(a.end.note):''}</div></div></div>`)+`</div>`;
  return h+`</div>`;

/* صورة */
function pickPhoto(){const inp=$('#fileIn');inp.value='';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
  try{const src=await resize(f);const a=curA();await idbPut('photos',a.id,src);a.photo=1;logE('photo',a,`صورة جديدة لـ ${dn(a)}`);save();renderPage()}catch(e){toast('تعذّر قراءة الصورة')}};inp.click()}
function resize(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1100,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};
  img.onerror=rej;img.src=u})}

/* نقل من صفحة الحيوان */
function moveSheet(){const a=curA(),p=penOf(a.id);
  sheet('نقل '+esc(dn(a)),`<div class="chips">${D.pens.filter(x=>x.type===a.type).map(x=>`<button class="${p&&p.id===x.id?'on':''}" onclick="${p&&p.id===x.id?'closeSheet()':`moveHere('${a.id}','${x.id}')`}">${esc(x.name)}</button>`).join('')}</div>`)}

/* تعديل */
function editAnimal(){const a=curA();
  sheet('تعديل '+esc(a.num),`<div class="f">
   <label>الرقم</label><input id="f_num" inputmode="numeric" value="${esc(a.num)}">
   <label>الفئة</label><select id="f_cat">${catOptions(a.type,a.cat)}</select>
   <label>تاريخ الميلاد</label><input id="f_birth" type="date" value="${esc(a.birth)}">
   <div class="two"><div><label>رقم الأب</label><input id="f_father" list="dlm" inputmode="numeric" value="${esc(a.father)}"></div><div><label>رقم الأم</label><input id="f_mother" list="dlf" inputmode="numeric" value="${esc(a.mother)}"></div></div>
   ${malesList(a.type)}${femalesList(a.type)}<div class="err" id="f_err"></div></div>
   <button class="pri" onclick="saveEdit()">حفظ</button>
   ${a.photo?`<button class="sec2" onclick="delPhoto()">حذف الصورة</button>`:''}
   <button class="sec2 danger" onclick="delAnimal()">حذف السجل نهائياً</button>`)}
function saveEdit(){const a=curA();const num=normNum($('#f_num').value);if(!num)return $('#f_err').textContent='اكتب الرقم';
  const cat=$('#f_cat').value,birth=$('#f_birth').value;
  if(a.status==='a'){const ex=findActive(a.type,num,spaceOf(a.type,cat));if(ex&&ex.id!==a.id)return $('#f_err').textContent=dn(ex)+' مستخدم لحيوان آخر'}
  const father=normNum($('#f_father').value),mother=normNum($('#f_mother').value);
  const before=dn(a),ch=[];
  if(num!==a.num)ch.push('الرقم '+a.num+' ← '+num);if(cat!==a.cat)ch.push('الفئة '+a.cat+' ← '+cat);
  if(birth!==a.birth)ch.push('الميلاد '+fmt(birth));if(father!==a.father)ch.push('الأب '+(father||'—'));if(mother!==a.mother)ch.push('الأم '+(mother||'—'));
  if(father!==a.father){a.father=father;const f=father&&findActive(a.type,father,'m');a.fatherId=f?f.id:''}
  if(mother!==a.mother){a.mother=mother;const m=mother&&findActive(a.type,mother,'o');a.motherId=m?m.id:''}
  // تحديث رقم المولود في سجل ولادات الأم
  if(num!==a.num){Object.values(D.animals).forEach(x=>x.births.forEach(b=>{if(b.childId===a.id)b.num=num}))}
  // تحديث سجل الولادة عند الأم (التاريخ والنوع)
  const mo=motherOf(a),rec=mo&&mo.births.find(b=>b.childId===a.id);
  if(rec&&(rec.date!==birth||rec.cat!==cat)){
    const old=rec.date,sibs=old&&birth!==old?mo.births.filter(b=>b!==rec&&b.date===old):[];
    if(sibs.length&&confirm(`هذا المولود ضمن ${birthOrder(mo,old)} للأم ${dn(mo)} مع ${sibs.length} ${sibs.length>1?'آخرين':'آخر'}.\nهل تريد تغيير تاريخ الولادة لهم كلهم إلى ${fmt(birth)}؟`))
      sibs.forEach(b=>{b.date=birth;pushToChild(mo,b)});
    rec.date=birth;rec.cat=cat}
  a.num=num;a.cat=cat;a.birth=birth;if(ch.length)logE('edit',a,`تعديل ${before}: ${ch.join('، ')}`);save();closeSheet();renderPage()}
async function delPhoto(){const a=curA();await idbDel('photos',a.id);a.photo=0;save();closeSheet();renderPage()}
async function delAnimal(){const a=curA();if(!confirm('حذف سجل الرقم '+a.num+' نهائياً مع ولاداته وأمراضه؟'))return;
  removeFromPens(a.id);Object.values(D.animals).forEach(x=>x.births.forEach(b=>{if(b.childId===a.id)b.childId=''}));
  logE('delete',null,`حذف سجل ${dn(a)} (${a.cat}) نهائياً`,a.type);delete D.animals[a.id];idbDel('photos',a.id).catch(()=>{});save();closeSheet();stack.pop();renderPage()}

/* الولادات */
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة','الحادية عشرة','الثانية عشرة'];
const ordinal=n=>ORD[n-1]||('رقم '+n);
// كل المواليد في نفس التاريخ = ولادة واحدة، مرتبة من الأقدم
function birthGroups(a){const m={};a.births.forEach(b=>{const k=b.date||('nd:'+b.id);(m[k]=m[k]||{key:k,date:b.date||'',items:[]}).items.push(b)});
  return Object.values(m).sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999'))}
function monthsBetween(d1,d2){const days=Math.round((new Date(d2)-new Date(d1))/864e5);if(days<1)return '';
  if(days<45)return days+' يوم';const m=Math.round(days/30.44);return m<24?m+' شهر':(Math.floor(m/12)+' سنة'+(m%12?' و'+(m%12)+' شهر':''))}
function birthOrder(a,date){const gs=birthGroups(a);const i=gs.findIndex(g=>g.date===date);return i<0?'':'الولادة '+ordinal(i+1)}
// تحديث المولود عند تعديل سجل الولادة
function pushToChild(a,b){const ch=b.childId&&D.animals[b.childId];if(!ch)return;ch.birth=b.date;ch.cat=b.cat;
  if(ch.father!==b.father){ch.father=b.father;const f=b.father&&findActive(a.type,b.father,'m');ch.fatherId=f?f.id:''}}
function motherOf(child){return Object.values(D.animals).find(x=>x.births.some(b=>b.childId===child.id))}
function groupByKey(a,key){return birthGroups(a).find(g=>g.key===key)}
function editGroup(key){const a=curA(),g=groupByKey(a,key);const i=birthGroups(a).indexOf(g);
  sheet('تعديل الولادة '+ordinal(i+1),`<div class="f"><label>تاريخ الولادة (يتغير لكل المواليد فيها)</label><input id="g_date" type="date" value="${esc(g.date)}">
   <label>رقم الأب (فحل)</label><input id="g_father" list="dlm" inputmode="numeric" value="${esc(g.items[0].father||'')}">${malesList(a.type)}<div class="err" id="f_err"></div></div>
   <button class="pri" onclick="saveGroup('${key}')">حفظ</button>`)}
function saveGroup(key){const a=curA(),g=groupByKey(a,key);const date=$('#g_date').value,father=normNum($('#g_father').value);
  if(!date)return $('#f_err').textContent='اختر التاريخ';
  g.items.forEach(b=>{b.date=date;b.father=father;pushToChild(a,b)});
  logE('edit',a,`تعديل ولادة ${dn(a)}: التاريخ ${fmt(date)}${father?' · الأب فحل '+father:''}`);save();closeSheet();renderPage();toast('عُدّلت الولادة')}
function editBirth(bid){const a=curA(),b=a.births.find(x=>x.id===bid);
  sheet('تعديل المولود',`<div class="f"><label>نوع المولود</label><select id="f_cat">${catOptions(a.type,b.cat)}</select>
   <label>تاريخ الولادة</label><input id="f_date" type="date" value="${esc(b.date)}">
   <label>رقم الأب (اختياري)</label><input id="f_father" list="dlm" inputmode="numeric" value="${esc(b.father||'')}">${malesList(a.type)}<div class="err" id="f_err"></div></div>
   <button class="pri" onclick="saveBirthEdit('${bid}')">حفظ</button>`)}
function saveBirthEdit(bid){const a=curA(),b=a.births.find(x=>x.id===bid);const cat=$('#f_cat').value;
  const ch=b.childId&&D.animals[b.childId];
  if(ch&&ch.status==='a'&&spaceOf(a.type,cat)!==spaceOf(a.type,ch.cat)){const ex=findActive(a.type,ch.num,spaceOf(a.type,cat));if(ex&&ex.id!==ch.id)return $('#f_err').textContent=dn(ex)+' مستخدم لحيوان آخر'}
  b.cat=cat;b.date=$('#f_date').value;b.father=normNum($('#f_father').value);pushToChild(a,b);
  logE('edit',a,`تعديل مولود ${dn(a)}: ${cat} · ${fmt(b.date)}`);save();closeSheet();renderPage()}
function birthForm(a,b){
  const youngDefault=CATS[a.type].find(c=>c[2]===0)[0];
  return `<div class="f">
   <label>نوع المولود</label><select id="f_cat">${catOptions(a.type,b?b.cat:youngDefault)}</select>
   <label>تاريخ الولادة</label><input id="f_date" type="date" value="${b&&b.date?esc(b.date):today()}">
   <label>رقم المولود (إذا تم ترقيمه)</label><input id="f_num" inputmode="numeric" autocomplete="off">
   <label>رقم الأب (اختياري)</label><input id="f_father" list="dlm" inputmode="numeric" value="${b?esc(b.father):''}">
   <label>الشبك الذي يوضع فيه المولود</label><select id="f_pen">${penOptions(a.type,(penOf(a.id)||{}).id)}</select>
   ${malesList(a.type)}<div class="err" id="f_err"></div></div>`;
}
function addBirth(date){const a=curA();sheet((date?'مولود إضافي في '+birthOrder(a,date):'ولادة جديدة')+' للرقم '+esc(a.num),birthForm(a,date?{date,cat:CATS[a.type].find(c=>c[2]===0)[0],father:(a.births.find(x=>x.date===date)||{}).father||''}:null)+`<button class="pri" onclick="saveBirth()">حفظ الولادة</button><button class="sec2" onclick="saveBirth(true)">حفظ وإضافة توأم</button>`)}
function makeChild(a,b,num,penId){
  const f=b.father&&findActive(a.type,b.father,'m');
  const ch=createAnimal({type:a.type,num,cat:b.cat,birth:b.date,father:b.father,fatherId:f?f.id:'',mother:a.num,motherId:a.id});
  place(ch.id,penId);b.num=num;b.childId=ch.id;return ch;
}
function saveBirth(twin){const a=curA();const num=normNum($('#f_num').value);const cat=$('#f_cat').value;
  if(num){const ex=findActive(a.type,num,spaceOf(a.type,cat));if(ex)return $('#f_err').textContent=dn(ex)+' مستخدم لحيوان آخر'}
  const penId=$('#f_pen').value;if(num&&!penId)return $('#f_err').textContent='اختر الشبك';
  const b={id:uid(),cat,date:$('#f_date').value,father:normNum($('#f_father').value),num:'',childId:''};
  if(num)makeChild(a,b,num,penId);a.births.push(b);
  const n=b.date?a.births.filter(x=>x.date===b.date).length:1;
  logE('birth',a,`${birthOrder(a,b.date)||'ولادة'} عند ${dn(a)}: ${cat}${num?' رقم '+num:' بدون رقم'}${n===2?' (توأم)':n>=3?' ('+n+' مواليد)':''}${b.father?' · الأب فحل '+b.father:''} · بتاريخ ${fmt(b.date)}`);save();
  if(twin){const keep=b;sheet('التوأم للرقم '+esc(a.num),birthForm(a,keep)+`<button class="pri" onclick="saveBirth()">حفظ التوأم</button>`);toast('حُفظت الولادة')}
  else{closeSheet();toast(num?'حُفظت ووُضع المولود في الشبك':'حُفظت الولادة')}renderPage()}
function numberBirth(bid){const a=curA();
  sheet('ترقيم المولود',`<div class="f"><label>رقم المولود</label><input id="f_num" inputmode="numeric" autocomplete="off">
   <label>الشبك</label><select id="f_pen">${penOptions(a.type,(penOf(a.id)||{}).id)}</select><div class="err" id="f_err"></div></div>
   <button class="pri" onclick="saveNumber('${bid}')">حفظ</button>`,()=>$('#f_num').focus())}
function saveNumber(bid){const a=curA(),b=a.births.find(x=>x.id===bid);const num=normNum($('#f_num').value);
  if(!num)return $('#f_err').textContent='اكتب الرقم';const ex=findActive(a.type,num,spaceOf(a.type,b.cat));if(ex)return $('#f_err').textContent=dn(ex)+' مستخدم لحيوان آخر';
  const penId=$('#f_pen').value;if(!penId)return $('#f_err').textContent='أضف شبكاً أولاً';
  makeChild(a,b,num,penId);logE('number',a,`ترقيم مولود ${dn(a)} (${b.cat}) برقم ${num}`);save();closeSheet();renderPage();toast('وُضع المولود في الشبك')}
function delBirth(bid){const a=curA(),b=a.births.find(x=>x.id===bid);
  if(!confirm('حذف هذه الولادة من السجل؟'+(b.childId?'\n(سجل المولود نفسه يبقى)':'')))return;
  a.births=a.births.filter(x=>x!==b);logE('edit',a,`حذف ولادة (${b.cat} ${fmt(b.date)}) من سجل ${dn(a)}`);save();renderPage()}

/* الأمراض */
function addIll(){sheet('تسجيل مرض',`<div class="f"><label>المرض / العارض</label><input id="f_name">
  <label>التاريخ</label><input id="f_date" type="date" value="${today()}">
  <label>العلاج / ملاحظات</label><textarea id="f_note" rows="3"></textarea><div class="err" id="f_err"></div></div>
  <button class="pri" onclick="saveIll()">حفظ</button>`,()=>$('#f_name').focus())}
function saveIll(){const name=$('#f_name').value.trim();if(!name)return $('#f_err').textContent='اكتب اسم المرض';
  const a=curA(),note=$('#f_note').value.trim();a.ills.push({id:uid(),name,date:$('#f_date').value,note});
  logE('ill',a,`مرض ${dn(a)}: ${name}${note?' — '+note:''}`);save();closeSheet();renderPage()}
function delIll(id){if(!confirm('حذف هذا السجل؟'))return;const a=curA(),il=a.ills.find(x=>x.id===id);a.ills=a.ills.filter(x=>x.id!==id);if(il)logE('edit',a,`حذف مرض «${il.name}» من سجل ${dn(a)}`);save();renderPage()}

/* الخروج */
function exitSheet(r){const a=curA();
  sheet(REASONS[r]+' — الرقم '+esc(a.num),`<div class="f"><label>التاريخ</label><input id="f_date" type="date" value="${today()}">
   <label>${r==='sold'?'السعر / المشتري / ملاحظات':'ملاحظات'}</label><textarea id="f_note" rows="3"></textarea></div>
   <div class="muted" style="font-size:14px;margin-top:10px">سيخرج الرقم ${esc(a.num)} من الشبك ويصبح متاحاً لحيوان آخر.</div>
   <button class="pri" onclick="saveExit('${r}')">تأكيد ${REASONS[r]}</button>`)}
function saveExit(r){const a=curA();a.status=r;a.end={date:$('#f_date').value,note:$('#f_note').value.trim()};removeFromPens(a.id);
  logE(r,a,`${REASONS[r]}: ${dn(a)} (${a.cat})${a.end.note?' — '+a.end.note:''} · بتاريخ ${fmt(a.end.date)}`);save();closeSheet();renderPage();toast('أصبح الرقم '+a.num+' حراً')}
function restoreAnimal(){const a=curA();if(findActive(a.type,a.num,spaceOf(a.type,a.cat)))return toast(dn(a)+' مستخدم الآن لحيوان آخر — عدّل رقمه أولاً');
  sheet('إرجاع الرقم '+esc(a.num),`<div class="f"><label>الشبك</label><select id="f_pen">${penOptions(a.type)}</select></div><button class="pri" onclick="doRestore()">إرجاع</button>`)}
function doRestore(){const a=curA(),pid=$('#f_pen').value;if(!pid)return toast('أضف شبكاً أولاً');a.status='a';a.end=null;place(a.id,pid);logE('restore',a,`إرجاع ${dn(a)} للحلال`);save();closeSheet();renderPage()}

/* بحث وأرشيف */
function openSearch(){sheet('بحث عن رقم',`<div class="f"><input id="f_q" inputmode="numeric" placeholder="اكتب الرقم" oninput="doSearch()"></div><div id="sr" style="margin-top:8px"></div>`,()=>$('#f_q').focus())}
function doSearch(){const q=normNum($('#f_q').value);if(!q){$('#sr').innerHTML='';return}
  const r=Object.values(D.animals).filter(a=>a.num.includes(q)).sort((a,b)=>(a.status==='a'?0:1)-(b.status==='a'?0:1)||a.num.length-b.num.length).slice(0,40);
  $('#sr').innerHTML=r.length?r.map(a=>{const p=penOf(a.id);return `<div class="item" onclick="openAnimal('${a.id}')"><div class="t"><b>${esc(dn(a))} · ${esc(a.cat)}</b><div>${typeName(a.type)} · ${a.status==='a'?(p?esc(p.name):'بدون شبك'):REASONS[a.status]+' '+fmt(a.end&&a.end.date)}</div></div><span class="tag">فتح</span></div>`}).join(''):'<div class="empty">لا نتائج</div>'}
function openArchive(){const r=Object.values(D.animals).filter(a=>a.type===cur&&a.status!=='a').sort((a,b)=>((b.end&&b.end.date)||'').localeCompare((a.end&&a.end.date)||''));
  sheet('أرشيف '+typeName(cur),r.length?r.map(a=>`<div class="item" onclick="openAnimal('${a.id}')"><div class="t"><b>${esc(dn(a))} · ${esc(a.cat)}</b><div>${REASONS[a.status]} · ${fmt(a.end&&a.end.date)}${a.end&&a.end.note?' · '+esc(a.end.note):''}</div></div><span class="tag">فتح</span></div>`).join(''):'<div class="empty">لا يوجد شيء في الأرشيف</div>')}

/* صفحة التغييرات */
const LOGK={add:['➕','إضافة'],birth:['🍼','ولادة'],number:['🔢','ترقيم'],ill:['🩺','مرض'],dead:['✖️','موت'],sold:['💰','بيع'],slaughter:['🔪','ذبح'],
  move:['⇄','نقل'],edit:['✏️','تعديل'],restore:['↩️','إرجاع'],delete:['🗑️','حذف'],pen:['🧱','شبوك'],photo:['📷','صورة']};
let logDays=7,logType='all',logKind='all';
function openLog(){logType=cur;renderLog()}
function renderLog(){
  const from=logDays?Date.now()-logDays*864e5:0;
  const base=(D.log||[]).filter(e=>e.t>=from&&(logType==='all'||e.type===logType));
  const list=base.filter(e=>logKind==='all'||e.k===logKind).slice().reverse();
  const cnt=k=>base.filter(e=>e.k===k).length;
  const chip=(v,cv,fn,label)=>`<button class="${v===cv?'on':''}" onclick="${fn}">${label}</button>`;
  let h=`<div class="chips">${[[7,'آخر ٧ أيام'],[30,'٣٠ يوم'],[0,'الكل']].map(([d,l])=>chip(d,logDays,`logDays=${d};renderLog()`,l)).join('')}</div>
   <div class="chips" style="margin-top:8px">${chip('all',logType,"logType='all';renderLog()",'كل الأقسام')}${TYPES.map(t=>chip(t.k,logType,`logType='${t.k}';renderLog()`,t.n)).join('')}</div>
   <div class="chips" style="margin-top:8px">${chip('all',logKind,"logKind='all';renderLog()",'الكل '+base.length)}${['birth','dead','sold','slaughter','ill','add'].map(k=>chip(k,logKind,`logKind='${k}';renderLog()`,LOGK[k][0]+' '+LOGK[k][1]+' '+cnt(k))).join('')}</div>`;
  let day='';
  h+=list.length?list.map(e=>{const d=new Date(e.t);const dk=d.toDateString();let s='';
    if(dk!==day){day=dk;s=`<div class="dayh">${d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long'})} ${fmt(new Date(e.t-d.getTimezoneOffset()*6e4).toISOString().slice(0,10))}</div>`}
    const ok=e.id&&D.animals[e.id];
    return s+`<div class="item" ${ok?`onclick="openAnimal('${e.id}')"`:''}><span class="lg-ico">${(LOGK[e.k]||['•'])[0]}</span><div class="t" style="font-size:15px">${esc(e.x)}${logType==='all'?`<div>${typeName(e.type)}</div>`:''}</div><span class="lg-time">${d.toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'})}</span></div>`}).join('')
   :'<div class="empty" style="margin-top:14px">لا توجد تغييرات في هذه الفترة</div>';
  sheet('📋 التغييرات',h);
}

/* نسخ احتياطي */
function openBackup(){const all=actives();
  sheet('النسخ الاحتياطي',`<div class="muted" style="font-size:15px;line-height:1.8">${TYPES.map(t=>t.n+': <b>'+all.filter(a=>a.type===t.k).length+'</b>').join(' · ')}<br>
  البيانات محفوظة داخل الجوال. احفظ نسخة في «الملفات» بين فترة وأخرى حتى لا تضيع إذا حُذف التطبيق.</div>
  <button class="pri" onclick="exportData()">⬆️ حفظ نسخة احتياطية</button>
  <button class="sec2" onclick="$('#impIn').click()">⬇️ استرجاع من نسخة</button>`)}
async function exportData(){try{
  const photos=await idbAllPhotos();const blob=new Blob([JSON.stringify({app:'halali',v:1,date:new Date().toISOString(),D,photos})],{type:'application/json'});
  const name='halali-'+today()+'.json';const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name})}
  else{const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
}catch(e){if(e.name!=='AbortError')toast('تعذّر التصدير')}}
$('#impIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=='halali'||!j.D)throw 0;
    if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة المختارة. متابعة؟'))return;
    D=j.D;D.log=D.log||[];await idbClear('photos');for(const k in (j.photos||{}))await idbPut('photos',k,j.photos[k]);
    save();stack=[];closeSheet();renderPage();toast('تم الاسترجاع')}catch(err){toast('الملف غير صالح')}});

/* الورقة السفلية */
function sheet(title,body,ready){const el=$('#sheet');
  el.innerHTML=`<div class="sh-bg" onclick="closeSheet()"></div><div class="sh-box"><div class="sh-head"><b>${title}</b><button class="x" onclick="closeSheet()">✕</button></div>${body}</div>`;
  el.classList.add('on');if(ready)setTimeout(ready,60)}
function closeSheet(){const el=$('#sheet');el.classList.remove('on');el.innerHTML=''}

/* البدء */
(async()=>{
  try{await openDB();const d=await idbGet('kv','db');
    if(d&&d.animals)D=d;else{
      TYPES.forEach(t=>{D.pens.push({id:uid(),type:t.k,name:'الفحول',cells:Array(5).fill(null)},
        {id:uid(),type:t.k,name:'شبك الأمهات',cells:Array(10).fill(null)},
        {id:uid(),type:t.k,name:'شبك الصغار',cells:Array(10).fill(null)})});save()}
  }catch(e){toast('تعذّر فتح قاعدة البيانات')}
  D.log=D.log||[];
  // إصلاح السجلات القديمة: تاريخ الولادة عند الأم يتبع تاريخ ميلاد المولود
  let fixed=0;Object.values(D.animals).forEach(mo=>mo.births.forEach(b=>{const c=b.childId&&D.animals[b.childId];
    if(c&&c.birth&&c.birth!==b.date){b.date=c.birth;fixed++}if(c&&c.cat&&c.cat!==b.cat){b.cat=c.cat;fixed++}}));if(fixed)save();
  try{cur=localStorage.getItem('cur')||'harri'}catch(e){}
  if(!TYPES.some(t=>t.k===cur))cur='harri';
  render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let rl=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{})}
})();
</script>
